<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G1 Batch Daily Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --accent: #8b5cf6; --accent-glow: rgba(139, 92, 246, 0.5);
            --success: #10b981; --danger: #f43f5e; --warning: #f59e0b;
            --border: rgba(51, 65, 85, 0.5);
        }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body { background-color: var(--bg-color); background-image: radial-gradient(circle at top right, #1e1b4b, #0f172a 40%); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 100px; min-height: 100vh; }
        header { padding: 20px 16px 10px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
        h1 { margin: 0 0 5px 0; font-size: 1.8rem; background: linear-gradient(to right, #3b82f6, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 15px; font-weight: 500; }

        /* Scroller */
        .date-scroller { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 10px; scrollbar-width: none; }
        .date-scroller::-webkit-scrollbar { display: none; }
        .date-btn { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; min-width: 68px; padding: 12px 6px; text-align: center; cursor: pointer; color: var(--text-muted); transition: all 0.3s; flex-shrink: 0; }
        .date-btn.active { background: linear-gradient(145deg, rgba(139, 92, 246, 0.2), rgba(59, 130, 246, 0.2)); border-color: var(--accent); color: white; box-shadow: 0 0 15px var(--accent-glow); transform: translateY(-2px); }
        .date-btn .day { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .date-btn .date-num { font-size: 1.4rem; font-weight: bold; margin-top: 4px; }

        .container { padding: 16px; }
        .section-title { font-size: 1.2rem; margin-bottom: 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Cards */
        .card { background: var(--card-bg); backdrop-filter: blur(5px); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); animation: slideUpFade 0.4s ease-out forwards; opacity: 0; position: relative; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .subject-name { font-size: 1.15rem; font-weight: 600; margin: 0; color: #e2e8f0; padding-right: 30px; }
        .badge { background: #334155; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.2); }
        .remove-btn { position: absolute; top: 18px; right: 18px; background: rgba(244, 63, 94, 0.2); border: none; color: #f43f5e; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        
        /* Action Buttons */
        .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: rgba(0,0,0,0.2); padding: 6px; border-radius: 14px; margin-top: 15px; }
        .action-btn { padding: 10px 4px; border: none; border-radius: 10px; font-weight: bold; font-size: 0.85rem; cursor: pointer; background: transparent; color: var(--text-muted); transition: all 0.2s; }
        .action-btn.selected-attend { background: var(--success); color: white; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
        .action-btn.selected-miss { background: var(--danger); color: white; box-shadow: 0 0 10px rgba(244, 63, 94, 0.4); }
        .action-btn.selected-cancelled { background: var(--warning); color: white; box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
        .action-btn:active { transform: scale(0.95); }

        /* Floating Summary Button */
        .floating-summary { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; border: none; padding: 16px 32px; border-radius: 30px; font-weight: bold; font-size: 1.1rem; box-shadow: 0 10px 25px rgba(139, 92, 246, 0.5); cursor: pointer; z-index: 20; width: 90%; max-width: 400px; transition: transform 0.2s; }
        .add-extra-btn { background: rgba(255,255,255,0.05); color: var(--text-main); border: 1px dashed var(--border); width: 100%; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 20px; transition: 0.2s; }
        .add-extra-btn:active { background: rgba(255,255,255,0.1); }

        /* Modals */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); z-index: 30; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.3s ease; align-items: flex-end; justify-content: center; }
        .modal.show { opacity: 1; }
        .modal-content { background: linear-gradient(180deg, #1e293b, #0f172a); width: 100%; height: 90vh; border-top-left-radius: 30px; border-top-right-radius: 30px; padding: 24px; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .modal-mini { height: auto; padding-bottom: 40px; border-radius: 30px 30px 0 0; }
        .modal.show .modal-content { transform: translateY(0); }
        .close-btn { float: right; background: rgba(255,255,255,0.1); border: none; color: white; border-radius: 50%; width: 36px; height: 36px; font-size: 1.2rem; cursor: pointer; display:flex; align-items:center; justify-content:center; }
        
        select { width: 100%; padding: 14px; border-radius: 12px; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--border); font-size: 1rem; margin-bottom: 16px; outline: none; }
        select option { background: var(--bg-color); }
        .confirm-btn { background: var(--accent); color: white; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }

        /* Chart & Progress */
        .chart-container { position: relative; height: 250px; width: 100%; margin-bottom: 24px; background: rgba(0,0,0,0.2); border-radius: 16px; padding: 10px; }
        .progress-item { margin-bottom: 16px; background: rgba(0,0,0,0.15); padding: 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); }
        .p-header { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
        .p-bar-bg { width: 100%; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; margin-bottom: 10px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); }
        .p-bar-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 4px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); width: 0%; }
        .p-bar-fill.good { background: linear-gradient(90deg, #10b981, #34d399); }
        .p-bar-fill.bad { background: linear-gradient(90deg, #f43f5e, #fb7185); }
        .p-status { font-size: 0.85rem; color: #cbd5e1; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 1.2rem; background: rgba(255,255,255,0.02); border-radius: 20px; border: 1px dashed var(--border); margin-bottom: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>Daily Tracker</h1>
        <div class="subtitle">G1 Batch • Target: 80% by Nov 5</div>
        <div class="date-scroller" id="date-scroller"></div>
    </header>

    <div class="container">
        <div class="section-title">
            <span id="current-day-label">Loading...</span>
        </div>
        <div id="classes-container"></div>
        <button class="add-extra-btn" onclick="openExtraModal()">+ Add Extra Class</button>
    </div>

    <button class="floating-summary" onclick="openModal('progress-modal')">Open Dashboard</button>

    <!-- Dashboard Modal -->
    <div class="modal" id="progress-modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('progress-modal')">×</button>
            <h2 style="margin-top:0; font-size: 1.8rem; margin-bottom: 20px;">Dashboard</h2>
            <div class="chart-container"><canvas id="attendanceChart"></canvas></div>
            <h3 style="color: var(--text-muted); margin-bottom: 16px;">Subject Breakdown</h3>
            <div id="progress-list"></div>
        </div>
    </div>

    <!-- Extra Class Modal -->
    <div class="modal" id="extra-modal">
        <div class="modal-content modal-mini">
            <button class="close-btn" onclick="closeModal('extra-modal')">×</button>
            <h2 style="margin-top:0; font-size: 1.5rem; margin-bottom: 20px;">Add Extra Class</h2>
            <select id="extra-subject-select">
                <option value="" disabled selected>Select Subject...</option>
                <!-- Options injected via JS -->
            </select>
            <button class="confirm-btn" onclick="addExtraClass()">Add to Schedule</button>
        </div>
    </div>

    <script>
        /* =========================================
           1. TIMETABLE & SETTINGS
           ========================================= */
        const WEEKLY_TIMETABLE = {
            1: ["VLSI_TH", "ML_PR", "ML_TH", "DSP_TH"],       // Mon
            2: ["ML_TH","DBMS_TH", "DSP_TH","EMP_TH", "DSP_PR"],    // Tue
            3: ["VLSI_TH", "VLSI_TH", "DBMS_PR","DBMS_TH","AI_TH","AI_TH"], // Wed
            4: ["DBMS_TH", "ML_TH","EMP_TH","VLSI_PR", "AI_TH"],     // Thu
            5: ["DSP_TH", "PBL_PJ", "MCP_TH", "MCP_TH"],    // Fri
            6: [], 0: [] 
        };

        const HOLIDAYS = ["2026-10-02", "2026-10-20"];

        const SUBJECTS = {
            "EMP_TH":  { name: "Employability & Life Skills", type: "TH", baseP: 10, baseT: 22 },
            "AI_TH":   { name: "Artificial Intelligence", type: "TH", baseP: 27, baseT: 38 },
            "ML_TH":   { name: "Machine Learning", type: "TH", baseP: 32, baseT: 38 },
            "ML_PR":   { name: "Machine Learning", type: "PR", baseP: 17, baseT: 23 },
            "DSP_TH":  { name: "Digital Signal Processing", type: "TH", baseP: 24, baseT: 33 },
            "DSP_PR":  { name: "Digital Signal Processing", type: "PR", baseP: 20, baseT: 26 },
            "DBMS_TH": { name: "Database Management", type: "TH", baseP: 26, baseT: 37 },
            "DBMS_PR": { name: "Database Management", type: "PR", baseP: 22, baseT: 26 },
            "PBL_PJ":  { name: "Project based Learning-III", type: "PJ", baseP: 14, baseT: 20 },
            "VLSI_TH": { name: "VLSI Design", type: "TH", baseP: 25, baseT: 30 },
            "VLSI_PR": { name: "VLSI Design", type: "PR", baseP: 19, baseT: 25 },
            "MCP_TH":  { name: "Managing Conflicts", type: "TH", baseP: 11, baseT: 16 }
        };

        /* =========================================
           2. DATA STORAGE
           ========================================= */
        let selectedDateStr = "";
        let dailyLogs = JSON.parse(localStorage.getItem('g1_v2_logs')) || {};
        let extraClasses = JSON.parse(localStorage.getItem('g1_v2_extras')) || {};
        let myChart = null; 

        // Generate Dates: Oct 2 to Nov 5
        const dateList = [];
        const startD = new Date(2026, 9, 2); 
        const endD = new Date(2026, 10, 5);  // Nov 5
        let curr = new Date(startD);
        while(curr <= endD) {
            dateList.push(new Date(curr));
            curr.setDate(curr.getDate() + 1);
        }

        function formatDate(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        /* =========================================
           3. APP LOGIC
           ========================================= */
        function initApp() {
            // Populate select dropdown
            const select = document.getElementById('extra-subject-select');
            for(let id in SUBJECTS) {
                select.innerHTML += `<option value="${id}">${SUBJECTS[id].name} (${SUBJECTS[id].type})</option>`;
            }

            const scroller = document.getElementById('date-scroller');
            const daysArr = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            
            dateList.forEach(d => {
                const dateStr = formatDate(d);
                const btn = document.createElement('div');
                btn.className = 'date-btn';
                btn.id = `date-btn-${dateStr}`;
                btn.innerHTML = `<div class="day">${daysArr[d.getDay()]}</div><div class="date-num">${d.getDate()}</div>`;
                if(HOLIDAYS.includes(dateStr)) btn.innerHTML += `<div style="width:6px;height:6px;background:var(--accent);border-radius:50%;margin:4px auto 0;"></div>`;
                btn.onclick = () => selectDate(dateStr, d);
                scroller.appendChild(btn);
            });

            let todayStr = formatDate(new Date());
            let targetDateStr = dateList.some(d => formatDate(d) === todayStr) ? todayStr : formatDate(startD);
            let [y, m, day] = targetDateStr.split('-');
            selectDate(targetDateStr, new Date(y, m-1, day));
        }

        function selectDate(dateStr, dateObj) {
            if(selectedDateStr) document.getElementById(`date-btn-${selectedDateStr}`).classList.remove('active');
            selectedDateStr = dateStr;
            const activeBtn = document.getElementById(`date-btn-${selectedDateStr}`);
            activeBtn.classList.add('active');
            
            const scroller = document.getElementById('date-scroller');
            scroller.scrollTo({ left: activeBtn.offsetLeft - (scroller.offsetWidth / 2) + (activeBtn.offsetWidth / 2), behavior: 'smooth' });

            document.getElementById('current-day-label').innerText = dateObj.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
            renderClassesForDay(dateObj.getDay(), dateStr);
        }

        function renderClassesForDay(dayOfWeek, dateStr) {
            const container = document.getElementById('classes-container');
            container.innerHTML = "";

            // Combine Standard + Extra classes
            let stdClasses = WEEKLY_TIMETABLE[dayOfWeek] ? WEEKLY_TIMETABLE[dayOfWeek].map((id, idx) => ({ id, uid: `std_${id}_${idx}`, isExtra: false })) : [];
            let extClasses = extraClasses[dateStr] || [];
            let combined = [...stdClasses, ...extClasses];

            if (HOLIDAYS.includes(dateStr)) {
                container.innerHTML += `<div class="empty-state"><div style="font-size: 2.5rem;">🌴</div><strong>Holiday Scheduled!</strong><br><span style="font-size: 0.9rem;">No regular classes today.</span></div>`;
                combined = extClasses; // On holidays, only show explicitly added extra classes
            } else if(combined.length === 0) {
                container.innerHTML += `<div class="empty-state"><div style="font-size: 2.5rem;">🎉</div><strong>No classes scheduled!</strong></div>`;
            }

            if(!dailyLogs[dateStr]) dailyLogs[dateStr] = {};

            combined.forEach((cls) => {
                const sub = SUBJECTS[cls.id];
                if(!sub) return;

                const step = (sub.type === "TH") ? 1 : 2;
                const log = dailyLogs[dateStr][cls.uid];
                const currentStatus = log ? log.action : null;

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    ${cls.isExtra ? `<button class="remove-btn" onclick="removeExtraClass('${cls.uid}')">×</button>` : ''}
                    <div class="card-header">
                        <h3 class="subject-name">${sub.name} ${cls.isExtra ? '<span style="color:var(--accent); font-size:0.8rem;">(Extra)</span>' : ''}</h3>
                        <span class="badge">${sub.type}</span>
                    </div>
                    <div style="font-size: 0.85rem; color: var(--text-muted);">
                        Value: +${step} Present / +${step} Total
                    </div>
                    <div class="actions">
                        <button class="action-btn ${currentStatus === 'attend' ? 'selected-attend' : ''}" onclick="markLog('${dateStr}', '${cls.uid}', '${cls.id}', 'attend')">Attend</button>
                        <button class="action-btn ${currentStatus === 'miss' ? 'selected-miss' : ''}" onclick="markLog('${dateStr}', '${cls.uid}', '${cls.id}', 'miss')">Miss</button>
                        <button class="action-btn ${currentStatus === 'cancelled' ? 'selected-cancelled' : ''}" onclick="markLog('${dateStr}', '${cls.uid}', '${cls.id}', 'cancelled')">Cancel</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function markLog(dateStr, uid, subId, action) {
            if(dailyLogs[dateStr][uid] && dailyLogs[dateStr][uid].action === action) {
                delete dailyLogs[dateStr][uid]; // Toggle off
            } else {
                dailyLogs[dateStr][uid] = { action, subId };
            }
            localStorage.setItem('g1_v2_logs', JSON.stringify(dailyLogs));
            const [y, m, d] = dateStr.split('-');
            selectDate(dateStr, new Date(y, m-1, d));
        }

        /* --- Extra Class Logic --- */
        function openExtraModal() { openModal('extra-modal'); }
        
        function addExtraClass() {
            const select = document.getElementById('extra-subject-select');
            if(!select.value) return;
            if(!extraClasses[selectedDateStr]) extraClasses[selectedDateStr] = [];
            
            extraClasses[selectedDateStr].push({ id: select.value, uid: `ext_${Date.now()}`, isExtra: true });
            localStorage.setItem('g1_v2_extras', JSON.stringify(extraClasses));
            
            closeModal('extra-modal');
            select.value = "";
            const [y, m, d] = selectedDateStr.split('-');
            selectDate(selectedDateStr, new Date(y, m-1, d));
        }

        function removeExtraClass(uid) {
            if(confirm("Delete this extra class completely?")) {
                extraClasses[selectedDateStr] = extraClasses[selectedDateStr].filter(c => c.uid !== uid);
                localStorage.setItem('g1_v2_extras', JSON.stringify(extraClasses));
                if(dailyLogs[selectedDateStr]) { delete dailyLogs[selectedDateStr][uid]; localStorage.setItem('g1_v2_logs', JSON.stringify(dailyLogs)); }
                const [y, m, d] = selectedDateStr.split('-');
                selectDate(selectedDateStr, new Date(y, m-1, d));
            }
        }

        /* --- Stats & Dashboard --- */
        function calculateCurrentStats() {
            const currentStats = JSON.parse(JSON.stringify(SUBJECTS));
            for (const date in dailyLogs) {
                for (const uid in dailyLogs[date]) {
                    const log = dailyLogs[date][uid];
                    const sub = currentStats[log.subId];
                    if(!sub) continue;
                    
                    const step = (sub.type === "TH") ? 1 : 2;
                    if (log.action === 'attend') { sub.baseP += step; sub.baseT += step; } 
                    else if (log.action === 'miss') { sub.baseT += step; }
                    // 'cancelled' purposely does nothing to baseT/baseP
                }
            }
            return currentStats;
        }

        function renderDashboard() {
            const stats = calculateCurrentStats();
            const list = document.getElementById('progress-list');
            list.innerHTML = "";
            const chartLabels = [], chartData = [], targetData = [], bgColors = [];

            for(const [id, sub] of Object.entries(stats)) {
                const step = (sub.type === "TH") ? 1 : 2;
                const percentage = ((sub.baseP / sub.baseT) * 100);
                
                chartLabels.push(`${id.split('_')[0]} ${sub.type}`);
                chartData.push(percentage.toFixed(1)); targetData.push(80);
                bgColors.push(percentage >= 80 ? 'rgba(16, 185, 129, 0.8)' : 'rgba(244, 63, 94, 0.8)');

                let needed = Math.ceil((0.8 * sub.baseT - sub.baseP) / (0.2 * step));
                if (needed < 0) needed = 0;

                const isGood = percentage >= 80;
                const barColor = isGood ? 'good' : 'bad';
                const statusText = needed === 0 ? `<span style="color: #34d399">Target Reached!</span>` : `Need ${needed} back-to-back classes`;

                list.innerHTML += `
                    <div class="progress-item">
                        <div class="p-header">
                            <strong>${sub.name} <span style="font-size:0.75rem; color:#94a3b8">(${sub.type})</span></strong>
                            <span style="font-weight:bold; color: ${isGood ? '#34d399' : 'white'}">${percentage.toFixed(2)}%</span>
                        </div>
                        <div class="p-bar-bg"><div class="p-bar-fill ${barColor}" id="bar-${id}"></div></div>
                        <div class="p-header" style="font-size: 0.85rem; margin:0">
                            <span style="color: #94a3b8">${sub.baseP} / ${sub.baseT}</span>
                            <span class="p-status">${statusText}</span>
                        </div>
                    </div>`;

                setTimeout(() => { const b = document.getElementById(`bar-${id}`); if(b) b.style.width = `${percentage}%`; }, 50);
            }
            renderChart(chartLabels, chartData, targetData, bgColors);
        }

        function renderChart(labels, data, targetLine, colors) {
            const ctx = document.getElementById('attendanceChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { type: 'line', label: 'Target (80%)', data: targetLine, borderColor: '#8b5cf6', borderWidth: 2, borderDash: [5, 5], fill: false, pointRadius: 0 },
                        { type: 'bar', label: 'Current %', data: data, backgroundColor: colors, borderRadius: 6 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: { duration: 1500, easing: 'easeOutQuart' },
                    plugins: { legend: { labels: { color: '#cbd5e1' } } },
                    scales: { y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }, x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } } }
                }
            });
        }

        /* --- Modal Control --- */
        function openModal(id) {
            const modal = document.getElementById(id);
            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('show'); if(id === 'progress-modal') renderDashboard(); }, 10);
        }

        function closeModal(id) {
            const modal = document.getElementById(id);
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        window.onload = initApp;
    </script>
</body>
</html>
